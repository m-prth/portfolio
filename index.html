              minimalMuted: '#A1A1AA',

              'neo-active': '0px 0px 0px 0px #111111',
              'neo-dark': '5px 5px 0px 0px rgba(240, 240, 240, 0.4)',
              'neo-dark-sm': '3px 3px 0px 0px rgba(240, 240, 240, 0.4)',
              'neo-dark-lg': '8px 8px 0px 0px rgba(240, 240, 240, 0.5)',
              'neo-dark-hover': '2px 2px 0px 0px rgba(240, 240, 240, 0.4)',
              // Aurora shadows
              'aurora': '0 20px 40px -10px rgba(0,0,0,0.05)',
              'aurora-lg': '0 30px 60px -15px rgba(0,0,0,0.1)',
              'aurora-glow': '0 0 40px rgba(167, 139, 250, 0.3)',
            },
            borderWidth: {
              '3': '3px',
            },
            animation: {
              'marquee': 'marquee 25s linear infinite',
            },
            keyframes: {
              marquee: {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-100%)' },
              }
            },
            backdropBlur: {
              'xl': '20px',
              '2xl': '40px',
            }
          },
        },
      };
    </script>

    <!-- Satoshi font from Fontshare CDN -->
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
    <style>
      /* ====================================
         CSS VARIABLES FOR DESIGN SYSTEMS
         ==================================== */

      /* Neo-Brutalist Theme (Default) */
      :root, .neo-brutalist {
        --bg-primary: #F0F0F0;
        --bg-secondary: #FFFFFF;
        --text-primary: #111111;
        --text-secondary: #666666;
        --accent-primary: #FFDE59;
        --accent-secondary: #B388FF;
        --border-width: 4px;
        --border-color: #111111;
        --shadow: 5px 5px 0px 0px #111111;
        --radius: 0px;
        --font-display: 'Space Grotesk', sans-serif;
        --font-body: 'Inter', sans-serif;
      }

      .neo-brutalist.dark {
        --bg-primary: #111111;
        --bg-secondary: #1a1a1a;
        --text-primary: #F0F0F0;
        --text-secondary: #888888;
        --border-color: #F0F0F0;
        --shadow: 5px 5px 0px 0px rgba(240,240,240,0.4);
        --accent-primary: #FF4081;
      }

      /* Dark Minimal Theme */
      .dark-minimal {
        --bg-primary: #000000;
        --bg-secondary: #0a0a0a;
        --text-primary: #FAFAFA;
        --text-secondary: #A1A1AA;
        --accent-primary: #FAFAFA;
        --accent-secondary: #71717A;
        --border-width: 1px;
        --border-color: rgba(255,255,255,0.1);
        --shadow: none;
        --radius: 0.5rem;
        --font-display: 'Playfair Display', serif;
        --font-body: 'Manrope', sans-serif;
      }

      .dark-minimal.dark {
        --bg-primary: #000000;
        --bg-secondary: #0a0a0a;
      }

      /* Aurora Theme */
      .aurora {
        --bg-primary: #FAFAFA;
        --bg-secondary: #FFFFFF;
        --text-primary: #18181B;
        --text-secondary: #71717A;
        --accent-primary: #A78BFA;
        --accent-secondary: #38BDF8;
        --accent-tertiary: #FB7185;
        --border-width: 0px;
        --border-color: rgba(0,0,0,0.05);
        --shadow: 0 20px 40px -10px rgba(0,0,0,0.05);
        --radius: 1.5rem;
        --glass-bg: rgba(255,255,255,0.6);
        --glass-border: rgba(255,255,255,0.2);
        --font-display: 'Instrument Serif', serif;
        --font-body: 'Satoshi', 'Inter', sans-serif;
      }

      .aurora.dark {
        --bg-primary: #09090B;
        --bg-secondary: #18181B;
        --text-primary: #FAFAFA;
        --text-secondary: #A1A1AA;
        --border-color: rgba(255,255,255,0.05);
        --glass-bg: rgba(255,255,255,0.05);
        --glass-border: rgba(255,255,255,0.1);
        --shadow: 0 20px 40px -10px rgba(0,0,0,0.3);
      }

      /* ====================================
         THEME-SPECIFIC STYLES
         ==================================== */

      /* Dark Minimal: Override font rendering */
      .dark-minimal body,
      .dark-minimal * {
        font-family: 'Manrope', sans-serif;
      }

      .dark-minimal h1, .dark-minimal h2, .dark-minimal h3,
      .dark-minimal h4, .dark-minimal h5, .dark-minimal h6 {
        font-family: 'Playfair Display', serif;
        font-weight: 400;
        letter-spacing: -0.02em;
      }

      /* Aurora: Override font rendering */
      .aurora body,
      .aurora * {
        font-family: 'Satoshi', 'Inter', sans-serif;
      }

      .aurora h1, .aurora h2, .aurora h3,
      .aurora h4, .aurora h5, .aurora h6 {
        font-family: 'Instrument Serif', serif;
        font-weight: 400;
      }

      /* Aurora: Glass card utility */
      .aurora .glass-card {
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        border-radius: 1.5rem;
        box-shadow: var(--shadow);
      }

      /* ====================================
         CUSTOM SCROLLBAR - Neo Brutalist
         ==================================== */
      .neo-brutalist ::-webkit-scrollbar {
        width: 12px;
      }
      .neo-brutalist ::-webkit-scrollbar-track {
        background: #F0F0F0;
        border-left: 3px solid #111111;
      }
      .neo-brutalist ::-webkit-scrollbar-thumb {
        background: #FFDE59;
        border: 3px solid #111111;
      }
      .neo-brutalist ::-webkit-scrollbar-thumb:hover {
        background: #FF9100;
      }

      .neo-brutalist.dark ::-webkit-scrollbar-track {
        background: #111111;
        border-left: 3px solid #F0F0F0;
      }
      .neo-brutalist.dark ::-webkit-scrollbar-thumb {
        background: #B388FF;
        border: 3px solid #F0F0F0;
      }
      .neo-brutalist.dark ::-webkit-scrollbar-thumb:hover {
        background: #FFDE59;
      }

      /* Custom Scrollbar - Dark Minimal */
      .dark-minimal ::-webkit-scrollbar {
        width: 8px;
      }
      .dark-minimal ::-webkit-scrollbar-track {
        background: #000000;
      }
      .dark-minimal ::-webkit-scrollbar-thumb {
        background: #27272A;
        border-radius: 4px;
      }
      .dark-minimal ::-webkit-scrollbar-thumb:hover {
        background: #3F3F46;
      }

      /* Custom Scrollbar - Aurora */
      .aurora ::-webkit-scrollbar {
        width: 8px;
      }
      .aurora ::-webkit-scrollbar-track {
        background: transparent;
      }
      .aurora ::-webkit-scrollbar-thumb {
        background: rgba(167, 139, 250, 0.3);
        border-radius: 4px;
      }
      .aurora ::-webkit-scrollbar-thumb:hover {
        background: rgba(167, 139, 250, 0.5);
      }

      .aurora.dark ::-webkit-scrollbar-thumb {
        background: rgba(167, 139, 250, 0.2);
      }
      .aurora.dark ::-webkit-scrollbar-thumb:hover {
        background: rgba(167, 139, 250, 0.4);
      }

      /* ====================================
         PATTERN BACKGROUNDS - Neo Brutalist Only
         ==================================== */
      .neo-brutalist .pattern-dots {
        background-image: radial-gradient(#111 2px, transparent 2px);
        background-size: 20px 20px;
      }

      .neo-brutalist .pattern-grid {
        background-size: 40px 40px;
        background-image:
          linear-gradient(to right, rgba(17,17,17,0.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(17,17,17,0.05) 1px, transparent 1px);
      }

      .neo-brutalist.dark .pattern-dots {
        background-image: radial-gradient(rgba(240,240,240,0.3) 2px, transparent 2px);
      }

      .neo-brutalist.dark .pattern-grid {
        background-image:
          linear-gradient(to right, rgba(240,240,240,0.08) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(240,240,240,0.08) 1px, transparent 1px);
      }

      /* Dark Minimal & Aurora: No patterns */
      .dark-minimal .pattern-dots,
      .dark-minimal .pattern-grid,
      .aurora .pattern-dots,
      .aurora .pattern-grid {
        background-image: none;
      }

      /* ====================================
         AURORA MESH GRADIENT BACKGROUND
         ==================================== */
      .aurora-mesh-gradient {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: -1;
        pointer-events: none;
        overflow: hidden;
      }

      .aurora-mesh-gradient::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 30% 20%, rgba(167, 139, 250, 0.3) 0%, transparent 50%);
      }

      .aurora-mesh-gradient::after {
        content: '';
        position: absolute;
        bottom: -50%;
        right: -50%;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 70% 80%, rgba(56, 189, 248, 0.2) 0%, transparent 50%);
      }

      .aurora.dark .aurora-mesh-gradient::before {
        background: radial-gradient(circle at 30% 20%, rgba(167, 139, 250, 0.15) 0%, transparent 50%);
      }

      .aurora.dark .aurora-mesh-gradient::after {
        background: radial-gradient(circle at 70% 80%, rgba(56, 189, 248, 0.1) 0%, transparent 50%);
      }

      /* Third orb for Aurora */
      .aurora-orb-rose {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 60%;
        height: 60%;
        background: radial-gradient(circle at center, rgba(251, 113, 133, 0.15) 0%, transparent 50%);
        pointer-events: none;
      }

      .aurora.dark .aurora-orb-rose {
        background: radial-gradient(circle at center, rgba(251, 113, 133, 0.08) 0%, transparent 50%);
      }

      /* ====================================
         AURORA CURSOR SPOTLIGHT
         ==================================== */
      .aurora-spotlight {
        position: fixed;
        width: 400px;
        height: 400px;
        border-radius: 50%;
        pointer-events: none;
        z-index: 9999;
        background: radial-gradient(circle at center, rgba(167, 139, 250, 0.15) 0%, transparent 50%);
        transform: translate(-50%, -50%);
        transition: opacity 0.3s ease;
      }

      .aurora.dark .aurora-spotlight {
        background: radial-gradient(circle at center, rgba(167, 139, 250, 0.1) 0%, transparent 50%);
      }

      /* ====================================
         TRANSITIONS
         ==================================== */
      .theme-transition {
        transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      }

      /* Slower transitions for Dark Minimal */
      .dark-minimal * {
        transition-duration: 0.5s !important;
      }
    </style>
