<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parth Mistry | Data & Creative</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              neoBlack: '#111111',
              neoWhite: '#F0F0F0',
              neoYellow: '#FFDE59',
              neoPurple: '#B388FF',
              neoGreen: '#00E676',
              neoBlue: '#2979FF',
              neoRed: '#FF5252',
              neoOrange: '#FF9100',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
            },
            boxShadow: {
              'neo': '5px 5px 0px 0px #111111',
              'neo-sm': '3px 3px 0px 0px #111111',
              'neo-lg': '8px 8px 0px 0px #111111',
              'neo-hover': '2px 2px 0px 0px #111111',
              'neo-active': '0px 0px 0px 0px #111111',
              'neo-dark': '5px 5px 0px 0px rgba(240, 240, 240, 0.4)',
              'neo-dark-sm': '3px 3px 0px 0px rgba(240, 240, 240, 0.4)',
              'neo-dark-lg': '8px 8px 0px 0px rgba(240, 240, 240, 0.5)',
              'neo-dark-hover': '2px 2px 0px 0px rgba(240, 240, 240, 0.4)',
            },
            borderWidth: {
              '3': '3px',
            },
            animation: {
              'marquee': 'marquee 25s linear infinite',
            },
            keyframes: {
              marquee: {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-100%)' },
              }
            }
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Space+Grotesk:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
      /* Custom Scrollbar - Light Mode */
      ::-webkit-scrollbar {
        width: 12px;
      }
      ::-webkit-scrollbar-track {
        background: #F0F0F0;
        border-left: 3px solid #111111;
      }
      ::-webkit-scrollbar-thumb {
        background: #FFDE59;
        border: 3px solid #111111;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #FF9100;
      }

      /* Custom Scrollbar - Dark Mode */
      .dark ::-webkit-scrollbar-track {
        background: #111111;
        border-left: 3px solid #F0F0F0;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #B388FF;
        border: 3px solid #F0F0F0;
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background: #FFDE59;
      }

      /* Pattern - Light Mode */
      .pattern-dots {
        background-image: radial-gradient(#111 2px, transparent 2px);
        background-size: 20px 20px;
      }

      .pattern-grid {
        background-size: 40px 40px;
        background-image:
          linear-gradient(to right, rgba(17,17,17,0.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(17,17,17,0.05) 1px, transparent 1px);
      }

      /* Pattern - Dark Mode */
      .dark .pattern-dots {
        background-image: radial-gradient(rgba(240,240,240,0.3) 2px, transparent 2px);
      }

      .dark .pattern-grid {
        background-image:
          linear-gradient(to right, rgba(240,240,240,0.08) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(240,240,240,0.08) 1px, transparent 1px);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-neoWhite dark:bg-neoBlack text-neoBlack dark:text-neoWhite antialiased overflow-x-hidden selection:bg-neoPurple selection:text-white transition-colors duration-300">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
